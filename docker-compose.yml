  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    env_file:
      - .env.dev
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PYTHONUNBUFFERED: 1
    env_file:
      - .env.dev
    depends_on:
      redis:
        condition: service_healthy
